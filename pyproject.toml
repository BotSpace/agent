[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "agent"
version = "0.1.0"
description = "Botmother AI Agent — Claude Code level autonomous flow & platform builder"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Botmother" }]
dependencies = [
  # Core framework
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",

  # Graph orchestration
  "langgraph>=0.3.0",
  "langgraph-checkpoint-postgres>=2.0.0",
  "langchain-core>=0.3.20",
  "langsmith>=0.2.0",
  "prometheus-client>=0.21.0",

  # LLM providers (direct SDKs — no LiteLLM)
  "anthropic>=0.39.0",
  "openai>=1.55.0",
  "boto3>=1.35.0",

  # Persistence
  "sqlalchemy[asyncio]>=2.0.36",
  "psycopg[binary,pool]>=3.2.3",
  "asyncpg>=0.30.0",
  "alembic>=1.14.0",
  "redis>=5.2.0",
  "pgvector>=0.3.6",

  # External integrations
  "httpx>=0.27.0",
  "motor>=3.6.0",                       # async MongoDB (CRM tools)
  "tenacity>=9.0.0",                    # retry

  # Auth & utils
  "PyJWT[crypto]>=2.10.0",
  "cryptography>=44.0.0",
  "python-dotenv>=1.0.1",
  "orjson>=3.10.0",
  "structlog>=24.4.0",
  "typer>=0.13.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.8.0",
  "mypy>=1.13.0",
  "respx>=0.21.1",
]
otel = [
  "opentelemetry-api>=1.28.0",
  "opentelemetry-sdk>=1.28.0",
  "opentelemetry-instrumentation-fastapi>=0.49b2",
]

[project.scripts]
agent = "agent.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = false
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
