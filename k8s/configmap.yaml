apiVersion: v1
kind: ConfigMap
metadata:
  name: agentv3-config
data:
  AGENT_LLM_PROVIDER: "anthropic"
  AGENT_MODEL_PLANNER: "claude-opus-4-7"
  AGENT_MODEL_EXECUTOR: "claude-sonnet-4-6"
  AGENT_MODEL_CRITIC: "claude-haiku-4-5-20251001"
  AGENT_MODEL_EMBEDDING: "text-embedding-3-small"
  AGENT_MAX_INPUT_TOKENS: "200000"
  AGENT_MAX_OUTPUT_TOKENS: "16000"
  AGENT_MAX_TOOL_CALLS: "80"
  AGENT_MAX_WALL_SECONDS: "900"
  BACKEND_BASE_URL: "http://backend.botmother.svc.cluster.local:8000"
  MONGO_BASE_URL: "mongodb://mongo.botmother.svc.cluster.local:27017"
  MONGO_DB_PREFIX: "project_"
  AGENT_RAG_ENABLED: "true"
  AGENT_RAG_TOP_K: "6"
  AGENT_CORS_ORIGINS: "https://app.botmother.uz,https://botmother.uz"
---
apiVersion: v1
kind: Secret
metadata:
  name: agentv3-secrets
type: Opaque
stringData:
  ANTHROPIC_API_KEY: "REPLACE_ME"
  OPENAI_API_KEY: ""
  AGENT_DATABASE_URL: "postgresql+psycopg://agentv3:agentv3@postgres:5432/agentv3"
  AGENT_REDIS_URL: "redis://redis:6379/0"
  SESSION_SECRET: "REPLACE_ME_32_CHARS"
  AGENT_INTERNAL_API_TOKEN: "REPLACE_ME"
  BACKEND_INTERNAL_TOKEN: "REPLACE_ME"
