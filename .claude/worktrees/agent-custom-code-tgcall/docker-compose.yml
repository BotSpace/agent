services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: agent-postgres
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: agent
    ports:
      - "5433:5432"
    volumes:
      - agent_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: agent-redis
    ports:
      - "6380:6379"
    volumes:
      - agent_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  agent:
    build: .
    container_name: agent-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      AGENT_DATABASE_URL: postgresql+psycopg://agent:agent@postgres:5432/agent
      AGENT_REDIS_URL: redis://redis:6379/0
    ports:
      - "8100:8100"

volumes:
  agent_pg:
  agent_redis:
