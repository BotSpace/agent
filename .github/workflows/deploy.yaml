name: Build and Push Docker Image (tag + latest)

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'helm/**'
      - '*.md'

env:
  PROJECT_NAME: botspace/agent

permissions:
  contents: write

jobs:
  build-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure Docker push retries
        run: |
          sudo mkdir -p /etc/docker
          echo '{"max-concurrent-uploads":1}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          load: true
          push: false
          no-cache: true
          tags: ${{ env.PROJECT_NAME }}:test

      - name: Tag & push image
        run: |
          IMAGE_BASE=${{ vars.DOCKER_REGISTRY }}/${{ env.PROJECT_NAME }}
          docker tag ${{ env.PROJECT_NAME }}:test "$IMAGE_BASE:${{ env.SHORT_SHA }}"
          docker tag ${{ env.PROJECT_NAME }}:test "$IMAGE_BASE:latest"

          push_image() {
            local image="$1"
            for attempt in 1 2 3; do
              if docker push "$image"; then
                return 0
              fi
              echo "Push failed for $image (attempt $attempt), retrying..."
              sleep $((attempt * 20))
            done
            docker push "$image"
          }

          push_image "$IMAGE_BASE:${{ env.SHORT_SHA }}"
          push_image "$IMAGE_BASE:latest"

      - name: Update Helm values with new image tag
        run: |
          sed -i "s|tag:.*|tag: \"${{ env.SHORT_SHA }}\"|" helm/values.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/values.yaml
          git diff --cached --quiet || git commit -m "deploy: update image tag to ${{ env.SHORT_SHA }}"
          git push origin main
