# Dev environment overrides — merged on top of values.yaml
image:
  tag: "bda3933"

configMaps:
  config:
    AGENT_HOST: "0.0.0.0"
    AGENT_PORT: "8100"
    AGENT_LOG_LEVEL: "DEBUG"
    AGENT_CORS_ORIGINS: "https://botspace.uz,https://botmother.uz,https://beta.botmother.uz"
    AGENT_LLM_PROVIDER: "openai"
    AGENT_MODEL_PLANNER: "gpt-5.2"
    AGENT_MODEL_EXECUTOR: "gpt-5.2"
    AGENT_MODEL_CRITIC: "gpt-5.2"
    AGENT_MODEL_EMBEDDING: "text-embedding-3-small"
    AWS_REGION: "us-east-1"
    AGENT_MAX_INPUT_TOKENS: "200000"
    AGENT_MAX_OUTPUT_TOKENS: "16384"
    AGENT_MAX_TOOL_CALLS: "80"
    AGENT_MAX_WALL_SECONDS: "900"
    BACKEND_BASE_URL: "http://backend-golang:8080"
    MONGO_BASE_URL: "mongodb://mongodb:27017"
    ENGINE_BASE_URL: "http://engine-plugin:8090"
    AGENT_RAG_ENABLED: "false"
    AGENT_RAG_TOP_K: "6"
    JWT_ALGORITHM: "HS256"

resources:
  requests:
    cpu: 125m
    memory: 192Mi
  limits:
    cpu: 1000m
    memory: 1Gi

# Relax node affinity in dev to allow scheduling anywhere
affinity: {}
